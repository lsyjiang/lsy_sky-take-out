# 本地开发配置模板
# 用法：复制本文件为 application-dev.yml，把下面的占位符换成自己的真实值。
# application-dev.yml 已被 .gitignore 排除，不会提交到仓库。
sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 你的MySQL密码

  # 阿里云 OSS（用于菜品图片上传），没有可以留空，只是上传功能不可用
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: 你的AccessKeyId
    access-key-secret: 你的AccessKeySecret
    bucket-name: 你的BucketName

  redis:
    host: localhost
    port: 6379
    password: 你的Redis密码
    database: 10

  wechat:
    # 微信小程序（登录用）
    appid: 你的小程序AppID
    secret: 你的小程序AppSecret
    # 微信支付（可选，没有商户号时把 sky.pay.mock 保持 true 即可跑通流程）
    mchid: 你的商户号
    mchSerialNo: 你的商户API证书序列号
    privateKeyFilePath: D:\pay\apiclient_key.pem
    apiV3Key: 你的APIv3密钥
    weChatPayCertFilePath: D:\pay\wechatpay_xxx.pem
    notifyUrl: https://你的域名/notify/paySuccess
    refundNotifyUrl: https://你的域名/notify/refundSuccess

  # 百度地图 AK（校验收货地址是否超出配送范围）
  baidu:
    ak: 你的百度地图服务端AK

  pay:
    # true=跳过真实微信支付（没有商户号/证书时使用），false=走真实微信支付
    mock: true
